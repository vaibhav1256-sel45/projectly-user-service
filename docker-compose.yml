services:
  redis:
    image: redis:8
    container_name: user-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data

  mongo:
    image: mongo:7
    container_name: user-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  redis_data:
  mongo_data:
